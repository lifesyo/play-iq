<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>Play IQ — タグ付けプレイヤー</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Play IQ">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0b0e14;--panel:#141923;--panel-2:#1b2230;--line:#27303f;
    --txt:#e8edf5;--txt-dim:#8b97a8;--accent:#ff5a3c;--accent-2:#3ca5ff;
    --ok:#36d399;--warn:#fbbd23;--radius:14px;--shadow:0 8px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  input,textarea{-webkit-user-select:text;user-select:text;}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(60,165,255,.07), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, rgba(255,90,60,.08), transparent 55%),
      var(--bg);
    color:var(--txt);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:grid;grid-template-columns:240px 1fr 380px;grid-template-rows:auto 1fr;
    grid-template-areas:"head head head" "games main side";height:100vh;
    transition:grid-template-columns .25s ease;
  }
  /* 試合一覧の折りたたみ */
  .app.games-collapsed{grid-template-columns:0 1fr 380px;}
  .app.games-collapsed .games{transform:translateX(-100%);opacity:0;pointer-events:none;}
  .games{transition:transform .25s ease,opacity .2s ease;}
  /* 折りたたみ開閉ボタン（ヘッダー左） */
  .games-toggle{background:var(--panel-2);color:var(--txt);border:1px solid var(--line);cursor:pointer;width:32px;height:32px;border-radius:9px;font-size:16px;line-height:1;display:grid;place-items:center;transition:.12s;flex-shrink:0;}
  .games-toggle:hover{filter:brightness(1.15);color:var(--accent);}
  /* タグ並び替えトグル＆矢印ボタン */
  .reorder-toggle{background:var(--panel-2);color:var(--txt-dim);border:1px solid var(--line);cursor:pointer;padding:5px 11px;border-radius:8px;font-weight:700;font-size:12px;transition:.12s;}
  .reorder-toggle:hover{color:var(--accent-2);}
  .reorder-toggle.active{background:var(--accent-2);color:#fff;border-color:var(--accent-2);}
  .tag-btn .move{color:var(--txt-dim);font-size:14px;line-height:1;cursor:pointer;padding:0 3px;border-radius:4px;}
  .tag-btn .move:hover{color:var(--accent-2);}
  .tag-item .move-col{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
  .tag-item .move-col span{color:var(--txt-dim);font-size:13px;line-height:1;cursor:pointer;padding:1px 3px;border-radius:4px;}
  .tag-item .move-col span:hover{color:var(--accent-2);}
  /* 長押しドラッグ並び替え */
  .tag-item{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  .tag-item .note-input{-webkit-user-select:text;user-select:text;}
  .tag-item.dragging{box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:.95;background:var(--panel-2);border-color:var(--accent-2);}
  .drag-placeholder{border:2px dashed var(--accent-2);border-radius:11px;background:rgba(60,165,255,.06);margin:0;}
  .tag-btn.dragging-btn{box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:.95;border-color:var(--accent-2);}
  .tag-drag-ph{border:2px dashed var(--accent-2);border-radius:11px;background:rgba(60,165,255,.06);}
  header{
    grid-area:head;display:flex;align-items:center;gap:16px;padding:14px 22px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(27,34,48,.6),transparent);backdrop-filter:blur(8px);
  }
  .logo{display:flex;align-items:center;gap:11px;}
  .logo .mark{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(135deg,var(--accent),#ff8a3c);
    display:grid;place-items:center;font-weight:800;font-size:15px;
    color:#fff;letter-spacing:-.5px;box-shadow:0 4px 14px rgba(255,90,60,.4);
  }
  .logo h1{font-size:18px;font-weight:800;letter-spacing:-.3px;}
  .logo span{font-size:11px;color:var(--txt-dim);font-weight:600;letter-spacing:1px;text-transform:uppercase;}
  .cur-game{flex:1;display:flex;align-items:center;gap:12px;min-width:0;}
  .cur-game .title{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cur-game .date{font-size:12px;color:var(--txt-dim);font-weight:600;white-space:nowrap;}
  .btn{
    border:none;cursor:pointer;font-weight:700;font-size:13px;padding:10px 16px;
    border-radius:10px;transition:transform .1s,filter .15s;color:#fff;background:var(--accent-2);white-space:nowrap;
  }
  .btn:hover{filter:brightness(1.1);}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:var(--panel-2);color:var(--txt);border:1px solid var(--line);}
  .auth{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .sync-state{font-size:11.5px;color:var(--txt-dim);font-weight:600;white-space:nowrap;transition:color .2s;}
  .sync-state.saving{color:var(--warn);}
  .sync-state.saved{color:var(--ok);}
  .user-chip{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 10px;}
  .user-chip img{width:24px;height:24px;border-radius:50%;}
  .user-chip span{font-size:12.5px;font-weight:700;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .user-chip .logout{background:none;border:none;color:var(--txt-dim);cursor:pointer;font-size:15px;padding:2px 4px;border-radius:6px;transition:.12s;}
  .user-chip .logout:hover{color:var(--accent);}
  .games{grid-area:games;border-right:1px solid var(--line);background:rgba(20,25,35,.5);display:flex;flex-direction:column;overflow:hidden;}
  .games-head{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .games-head h2{font-size:13px;font-weight:700;color:var(--txt-dim);letter-spacing:.5px;text-transform:uppercase;}
  .add-game-btn{background:var(--accent-2);color:#fff;border:none;cursor:pointer;width:26px;height:26px;border-radius:8px;font-size:18px;line-height:1;display:grid;place-items:center;transition:.12s;}
  .add-game-btn:hover{filter:brightness(1.1);}
  .games-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:7px;}
  .games-list::-webkit-scrollbar{width:7px;}
  .games-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .game-card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 13px;cursor:pointer;transition:.15s;position:relative;}
  .game-card:hover{background:var(--panel-2);}
  .game-card.active{border-color:var(--accent);background:var(--panel-2);}
  .game-card.active::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;background:var(--accent);border-radius:0 3px 3px 0;}
  .game-card .gname{font-size:13.5px;font-weight:700;margin-bottom:3px;word-break:break-word;}
  .game-card .gmeta{font-size:11.5px;color:var(--txt-dim);display:flex;justify-content:space-between;gap:8px;}
  .game-card .gdel{position:absolute;top:9px;right:9px;color:var(--txt-dim);font-size:14px;opacity:0;transition:.12s;cursor:pointer;}
  .game-card:hover .gdel{opacity:.5;}
  .game-card .gdel:hover{opacity:1;color:var(--accent);}
  .games-empty{text-align:center;color:var(--txt-dim);font-size:12.5px;padding:40px 16px;line-height:1.9;}
  main{grid-area:main;padding:22px;display:flex;flex-direction:column;gap:18px;overflow:hidden;}
  .player-wrap{position:relative;width:100%;background:#000;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);aspect-ratio:16/9;}
  .player-wrap #player{width:100%;height:100%;}
  .player-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--txt-dim);font-size:14px;line-height:1.9;padding:20px;}
  .player-empty b{color:var(--txt);display:block;font-size:16px;margin-bottom:6px;}
  .tagdeck{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:13px;}
  .tagdeck.disabled{opacity:.45;pointer-events:none;}
  .tagdeck .deck-head{display:flex;align-items:center;justify-content:space-between;}
  .tagdeck .deck-head h2{font-size:13px;font-weight:700;color:var(--txt-dim);letter-spacing:.5px;text-transform:uppercase;}
  .transport{display:flex;gap:9px;}
  .tp-btn{flex:1;border:1px solid var(--line);background:var(--panel-2);color:var(--txt);cursor:pointer;padding:10px;border-radius:11px;font-weight:700;font-size:14px;transition:transform .1s,filter .15s;font-variant-numeric:tabular-nums;}
  .tp-btn:hover{filter:brightness(1.15);}
  .tp-btn:active{transform:scale(.96);}
  .tp-btn.speed{flex:0 0 64px;color:var(--accent-2);}
  .now{font-variant-numeric:tabular-nums;font-size:13px;color:var(--txt-dim);font-weight:600;}
  .now b{color:var(--accent);font-size:15px;}
  .tag-buttons{display:flex;flex-wrap:wrap;gap:9px;}
  .tag-btn{border:1px solid var(--line);background:var(--panel-2);color:var(--txt);cursor:pointer;padding:11px 16px;border-radius:11px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;transition:transform .1s,filter .15s;position:relative;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
  .tag-btn:hover{filter:brightness(1.15);transform:translateY(-1px);}
  .tag-btn:active{transform:scale(.95);}
  .tag-btn .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .tag-btn .x{margin-left:2px;color:var(--txt-dim);font-size:15px;line-height:1;opacity:0;transition:opacity .12s;padding:0 2px;border-radius:4px;}
  .tag-btn:hover .x{opacity:.7;}
  .tag-btn .x:hover{opacity:1;color:var(--accent);}
  .add-tag{border:1px dashed var(--line);background:transparent;color:var(--txt-dim);cursor:pointer;padding:11px 15px;border-radius:11px;font-weight:700;font-size:14px;transition:border-color .15s,color .15s;}
  .add-tag:hover{border-color:var(--accent-2);color:var(--accent-2);}
  .tag-btn.pending{border-color:var(--accent);background:rgba(255,90,60,.16);animation:pulse 1.1s ease-in-out infinite;}
  .tag-btn.pending .rec{color:var(--accent);font-size:12px;font-weight:800;}
  .tag-btn.blocked{opacity:.35;pointer-events:none;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,60,.4);}50%{box-shadow:0 0 0 5px rgba(255,90,60,0);}}
  .cancel-pending{border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;padding:11px 15px;border-radius:11px;font-weight:700;font-size:14px;transition:.15s;}
  .cancel-pending:hover{background:rgba(255,90,60,.12);}
  .tag-item .time .dash{margin:0 4px;color:var(--txt-dim);font-weight:600;}
  .tag-item .time .dur{display:block;font-size:10.5px;color:var(--txt-dim);font-weight:600;margin-top:2px;}
  .hint{font-size:11.5px;color:var(--txt-dim);line-height:1.6;}
  .hint kbd{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;font-family:inherit;color:var(--txt);}
  aside{grid-area:side;border-left:1px solid var(--line);background:rgba(20,25,35,.5);display:flex;flex-direction:column;overflow:hidden;}
  .side-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px;}
  .side-head .row{display:flex;align-items:center;justify-content:space-between;}
  .side-head h2{font-size:15px;font-weight:800;}
  .summary{display:flex;flex-wrap:wrap;gap:6px;}
  .sum-chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px;}
  .sum-chip .dot{width:8px;height:8px;border-radius:50%;}
  .sum-chip b{color:var(--txt);font-variant-numeric:tabular-nums;}
  .playall-bar{display:flex;align-items:center;gap:10px;}
  .playall-btn{background:var(--accent);color:#fff;border:none;cursor:pointer;padding:8px 14px;border-radius:9px;font-weight:700;font-size:13px;transition:.12s;}
  .playall-btn:hover{filter:brightness(1.1);}
  .playall-btn.playing{background:var(--warn);color:#1a1205;}
  .playall-info{font-size:11.5px;color:var(--txt-dim);font-weight:600;}
  .count-pill{background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:3px 11px;font-size:12px;font-weight:700;color:var(--txt-dim);}
  .filters{display:flex;flex-wrap:wrap;gap:6px;}
  .filter-chip{border:1px solid var(--line);background:var(--panel);color:var(--txt-dim);cursor:pointer;padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;transition:.15s;}
  .filter-chip .dot{width:8px;height:8px;border-radius:50%;}
  .filter-chip.active{color:var(--txt);background:var(--panel-2);border-color:var(--txt-dim);}
  .tag-list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
  .tag-list::-webkit-scrollbar{width:8px;}
  .tag-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .empty-list{text-align:center;color:var(--txt-dim);font-size:13px;padding:50px 20px;line-height:1.9;}
  .tag-item{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 13px;cursor:pointer;transition:.15s;display:flex;gap:11px;align-items:flex-start;border-left-width:3px;}
  .tag-item:hover{background:var(--panel-2);transform:translateX(-2px);}
  .tag-item .time{font-variant-numeric:tabular-nums;font-weight:800;font-size:13px;color:var(--accent-2);flex-shrink:0;min-width:64px;}
  .tag-item .body{flex:1;min-width:0;}
  .tag-item .label{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;}
  .tag-item .label .dot{width:9px;height:9px;border-radius:50%;}
  .tag-item .note{font-size:12px;color:var(--txt-dim);margin-top:3px;word-break:break-word;}
  .tag-item .note-input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:5px 8px;font-size:12px;margin-top:6px;outline:none;font-family:inherit;}
  .tag-item .del{color:var(--txt-dim);font-size:16px;line-height:1;cursor:pointer;flex-shrink:0;opacity:0;transition:.12s;padding:2px;}
  .tag-item:hover .del{opacity:.6;}
  .tag-item .del:hover{opacity:1;color:var(--accent);}
  .modal-bg{position:fixed;inset:0;background:rgba(5,7,11,.7);backdrop-filter:blur(4px);display:none;place-items:center;z-index:50;}
  .modal-bg.show{display:grid;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;width:360px;box-shadow:var(--shadow);}
  .modal h3{font-size:17px;font-weight:800;margin-bottom:18px;}
  .modal label{font-size:12px;color:var(--txt-dim);font-weight:700;display:block;margin-bottom:7px;}
  .modal input[type=text]{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--txt);padding:11px 13px;border-radius:10px;font-size:14px;outline:none;margin-bottom:16px;font-family:inherit;}
  .modal input:focus{border-color:var(--accent-2);}
  .swatches{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px;}
  .tpl-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
  .tpl-chip{border:1px solid var(--line);background:var(--panel-2);color:var(--txt);cursor:pointer;padding:7px 12px;border-radius:9px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;transition:.12s;position:relative;}
  .tpl-chip:hover{border-color:var(--accent-2);}
  .tpl-chip .dot{width:9px;height:9px;border-radius:50%;}
  .tpl-chip .tpl-x{color:var(--txt-dim);font-size:13px;margin-left:2px;padding:0 2px;}
  .tpl-chip .tpl-x:hover{color:var(--accent);}
  .tpl-save-row{display:flex !important;align-items:center;gap:8px;font-size:13px;color:var(--txt);font-weight:600;margin-bottom:18px;cursor:pointer;}
  .tpl-save-row input{width:auto;margin:0;}
  .swatch{width:30px;height:30px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:.12s;}
  .swatch.sel{border-color:#fff;transform:scale(1.12);}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions .btn{flex:1;justify-content:center;text-align:center;}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="games-toggle" id="gamesToggle" title="試合一覧の表示/非表示">☰</button>
    <div class="logo">
      <div class="mark">IQ</div>
      <div><h1>Play IQ</h1><span>Tagging Player</span></div>
    </div>
    <div class="cur-game" id="curGame">
      <div class="title" id="curTitle" style="color:var(--txt-dim);font-weight:600">試合を選択してください</div>
      <div class="date" id="curDate"></div>
    </div>
    <div class="auth" id="authBox">
      <span class="sync-state" id="syncState"></span>
      <button class="btn ghost" id="loginBtn">Googleでログイン</button>
      <div class="user-chip" id="userChip" style="display:none">
        <img id="userPhoto" alt="">
        <span id="userName"></span>
        <button class="logout" id="logoutBtn" title="ログアウト">⏻</button>
      </div>
    </div>
  </header>
  <div class="games">
    <div class="games-head">
      <h2>試合</h2>
      <button class="add-game-btn" id="addGameBtn" title="試合を追加">＋</button>
    </div>
    <div class="games-list" id="gamesList"></div>
  </div>
  <main>
    <div class="player-wrap" id="playerWrap">
      <div id="player"></div>
      <div class="player-empty" id="playerEmpty">
        <div><b>試合を追加して始めましょう</b>
        左上の ＋ から、試合名・日付・YouTube の URL を入力してください。<br>
        動画は限定公開（Unlisted）でOKです。</div>
      </div>
    </div>
    <div class="tagdeck disabled" id="tagdeck">
      <div class="deck-head">
        <h2>タグを打つ</h2>
        <div class="now">現在位置 <b id="nowTime">0:00</b></div>
      </div>
      <div class="transport">
        <button class="tp-btn" id="back5">⏪ 5秒</button>
        <button class="tp-btn" id="playpause">▶ / ⏸</button>
        <button class="tp-btn" id="fwd5">5秒 ⏩</button>
        <button class="tp-btn speed" id="speedBtn">1x</button>
      </div>
      <div class="tag-buttons" id="tagButtons"></div>
      <div class="hint">タグは<b>2回押し</b>で区間を記録します。プレー開始時に1回押す→終了時にもう一度同じタグを押すと、その区間が記録されます。<kbd>1</kbd>〜<kbd>9</kbd>でタグ打ち、<kbd>,</kbd>／<kbd>.</kbd>で5秒戻る／進む。連続再生はこの区間どおりに再生されます。</div>
    </div>
  </main>
  <aside>
    <div class="side-head">
      <div class="row"><h2>タグ一覧</h2><span class="count-pill" id="countPill">0 件</span></div>
      <div class="summary" id="summary"></div>
      <div class="filters" id="filters"></div>
      <div class="playall-bar" id="playallBar" style="display:none">
        <button class="playall-btn" id="playAllBtn">▶ 連続再生</button>
        <span class="playall-info" id="playallInfo"></span>
      </div>
    </div>
    <div class="tag-list" id="tagList">
      <div class="empty-list">試合を選ぶとタグが表示されます。</div>
    </div>
  </aside>
</div>
<div class="modal-bg" id="gameModalBg">
  <div class="modal">
    <h3>試合を追加</h3>
    <label>試合名</label>
    <input type="text" id="gName" placeholder="例：○○中学戦">
    <label>日付</label>
    <input type="text" id="gDate" placeholder="例：令和8年5月23日">
    <label>YouTube URL</label>
    <input type="text" id="gUrl" placeholder="https://youtu.be/...">
    <div class="modal-actions">
      <button class="btn ghost" id="cancelGame">キャンセル</button>
      <button class="btn" id="createGame">追加</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="tagModalBg">
  <div class="modal">
    <h3>新しいタグを作る</h3>

<script>
const PALETTE=["#ff5a3c","#3ca5ff","#36d399","#fbbd23","#a78bfa","#f471b5","#2dd4bf","#fb923c"];
const DEFAULT_TAGTYPES=()=>[
  {id:"t1",name:"リバウンド",color:"#3ca5ff"},
  {id:"t2",name:"ターンオーバー",color:"#ff5a3c"},
  {id:"t3",name:"シュート",color:"#36d399"},
];
let games=[],currentGameId=null,activeFilter=null,selectedColor=PALETTE[0];
let tagTemplates=[]; // 定番タグ {name,color}
function curGame(){return games.find(g=>g.id===currentGameId)||null;}
let player=null,pollTimer=null;
function playerReady(){return !!(player&&typeof player.getCurrentTime==="function"&&typeof player.getPlayerState==="function"&&player.getPlayerState()!==-1);}
function onYouTubeIframeAPIReady(){}
function extractId(url){const m=url.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/);return m?m[1]:(url.trim().length===11?url.trim():null);}
function mountVideo(videoId){
  document.getElementById("playerEmpty").style.display="none";
  if(player){player.loadVideoById(videoId);startPoll();return;}
  player=new YT.Player("player",{videoId,playerVars:{rel:0,modestbranding:1,playsinline:1},events:{onReady:()=>{startPoll();}}});
}
function startPoll(){clearInterval(pollTimer);pollTimer=setInterval(()=>{if(playerReady()){document.getElementById("nowTime").textContent=fmt(player.getCurrentTime());}},250);}
function fmt(s){s=Math.floor(s||0);const m=Math.floor(s/60),sec=s%60;return m+":"+String(sec).padStart(2,"0");}
function openGameModal(){document.getElementById("gName").value="";document.getElementById("gDate").value="";document.getElementById("gUrl").value="";document.getElementById("gameModalBg").classList.add("show");document.getElementById("gName").focus();}
function closeGameModal(){document.getElementById("gameModalBg").classList.remove("show");}
function createGame(){
  const name=document.getElementById("gName").value.trim();
  const date=document.getElementById("gDate").value.trim();
  const url=document.getElementById("gUrl").value.trim();
  if(!name){alert("試合名を入力してください。");return;}

  const g={id:"g_"+Date.now(),name,date,videoId:vid,tagTypes:DEFAULT_TAGTYPES(),tags:[]};
  games.unshift(g);closeGameModal();renderGames();selectGame(g.id);scheduleSave();

function selectGame(id){
  currentGameId=id;activeFilter=null;

}
function delGame(id){
  const g=games.find(x=>x.id===id);if(!g)return;
  if(!confirm("試合「"+g.name+"」を削除しますか？タグもすべて消えます。"))return;

  }
  renderGames();renderTagButtons();renderFilters();renderTags();scheduleSave();
}
function renderGames(){
  const box=document.getElementById("gamesList");
  if(games.length===0){box.innerHTML='<div class="games-empty">まだ試合がありません。<br>右上の ＋ から追加してください。</div>';return;}
  box.innerHTML="";
  games.forEach(g=>{
    const c=document.createElement("div");
    c.className="game-card"+(g.id===currentGameId?" active":"");
    c.innerHTML='<div class="gname">'+escapeHtml(g.name)+'</div>'+
      '<div class="gmeta"><span>'+escapeHtml(g.date||"日付なし")+'</span><span>'+g.tags.length+' タグ</span></div>'+
      '<span class="gdel" title="削除">×</span>';
    c.onclick=(e)=>{if(e.target.classList.contains("gdel"))return;selectGame(g.id);};
    c.querySelector(".gdel").onclick=(e)=>{e.stopPropagation();delGame(g.id);};
    box.appendChild(c);
  });
}
let pending=null; // {typeId, start} 計測中のタグ
function addTag(typeId){
  const g=curGame();if(!g)return;
  if(!playerReady()){alert("動画の読み込みを待ってください。");return;}
  const t=player.getCurrentTime();
  if(pending && pending.typeId===typeId){
    // 2回目：終了点を記録して確定
    let start=pending.start, end=t;
    if(end<start){const tmp=start;start=end;end=tmp;} // 逆順なら入れ替え
    if(end-start<0.3) end=start+0.3; // 最低長を確保
    g.tags.push({id:"tag_"+Date.now()+"_"+Math.random().toString(36).slice(2,6),typeId,start,end,note:""});
    g.tags.sort((a,b)=>a.start-b.start);
    pending=null;
    renderTagButtons();renderTags();renderGames();scheduleSave();
  }else if(pending && pending.typeId!==typeId){
    // 別のタグが計測中：無視（1つずつ区間を作る）
    return;
  }else{
    // 1回目：開始点を記録して計測開始
    pending={typeId,start:t};
    renderTagButtons();
  }
}
function cancelPending(){ pending=null; renderTagButtons(); }
function seekTo(time){if(playAll.on)stopPlayAll();if(player&&player.seekTo){player.seekTo(time,true);player.playVideo();}}
function delTag(id){const g=curGame();if(!g)return;g.tags=g.tags.filter(t=>t.id!==id);renderTags();renderGames();scheduleSave();}
function setNote(id,val){const g=curGame();if(!g)return;const t=g.tags.find(x=>x.id===id);if(t)t.note=val;scheduleSave();}
function typeById(id){const g=curGame();if(!g)return{name:"?",color:"#888"};return g.tagTypes.find(t=>t.id===id)||{name:"?",color:"#888"};}
// 旧タグ(time)と新タグ(start/end)の両方から開始・終了を取り出す
function tagStart(t){return t.start!==undefined?t.start:t.time;}
function tagEnd(t){return t.end!==undefined?t.end:undefined;}
function renderTagButtons(){
  const box=document.getElementById("tagButtons");box.innerHTML="";
  const g=curGame();if(!g)return;
  g.tagTypes.forEach((t,i)=>{
    const b=document.createElement("button");
    const isPending=pending&&pending.typeId===t.id;
    const isBlocked=pending&&pending.typeId!==t.id;
    b.className="tag-btn"+(isPending?" pending":"")+(isBlocked?" blocked":"");
    b.dataset.typeId=t.id;
    if(isPending){
      b.innerHTML='<span class="dot" style="background:'+t.color+'"></span>'+escapeHtml(t.name)+
        ' <span class="rec">● 終了を押す</span>';
    }else{
      b.innerHTML='<span class="dot" style="background:'+t.color+'"></span>'+escapeHtml(t.name)+
        (i<9?'<span style="color:var(--txt-dim);font-size:11px;margin-left:3px">'+(i+1)+'</span>':"")+
        '<span class="x" title="削除">×</span>';
      b.querySelector(".x").onclick=(e)=>{e.stopPropagation();if(confirm("タグ「"+t.name+"」を削除しますか？")){g.tagTypes=g.tagTypes.filter(x=>x.id!==t.id);if(activeFilter===t.id)activeFilter=null;renderTagButtons();renderFilters();renderTags();scheduleSave();}};
    }
    b.onclick=()=>{ if(b.dataset.dragging==="1")return; addTag(t.id); };
    if(!isPending) attachTypeDrag(b);
    box.appendChild(b);
  });
  if(pending){
    const cancel=document.createElement("button");cancel.className="cancel-pending";cancel.textContent="✕ 計測キャンセル";cancel.onclick=cancelPending;box.appendChild(cancel);
  }else{
    const add=document.createElement("button");add.className="add-tag";add.textContent="＋ タグを追加";add.onclick=openTagModal;box.appendChild(add);
  }
}
/* タグ種別ボタンの長押しドラッグ並び替え（横方向） */
function attachTypeDrag(btn){
  let pressTimer=null,dragging=false,startX=0,startY=0,box=null,placeholder=null;
  const LONG_PRESS=250;
  function onDown(e){
    if(e.target.classList.contains("x"))return;
    const pt=e.touches?e.touches[0]:e;
    startX=pt.clientX;startY=pt.clientY;
    pressTimer=setTimeout(()=>beginDrag(),LONG_PRESS);
    document.addEventListener("touchmove",onMove,{passive:false});
    document.addEventListener("mousemove",onMove);
    document.addEventListener("touchend",onUp);
    document.addEventListener("mouseup",onUp);
  }
  function beginDrag(){
    dragging=true;btn.dataset.dragging="1";
    box=document.getElementById("tagButtons");
    if(navigator.vibrate)navigator.vibrate(20);
    placeholder=document.createElement("div");
    placeholder.className="tag-drag-ph";
    placeholder.style.width=btn.offsetWidth+"px";
    placeholder.style.height=btn.offsetHeight+"px";
    btn.parentNode.insertBefore(placeholder,btn.nextSibling);
    btn.classList.add("dragging-btn");
    btn.style.width=btn.offsetWidth+"px";
  }
  function onMove(e){
    if(pressTimer&&!dragging){
      const pt=e.touches?e.touches[0]:e;
      if(Math.abs(pt.clientX-startX)>10||Math.abs(pt.clientY-startY)>10){clearTimeout(pressTimer);pressTimer=null;cleanup();}
      return;
    }
    if(!dragging)return;
    e.preventDefault();
    const pt=e.touches?e.touches[0]:e;
    btn.style.position="fixed";btn.style.zIndex="9999";btn.style.pointerEvents="none";
    btn.style.left=(pt.clientX-btn.offsetWidth/2)+"px";
    btn.style.top=(pt.clientY-btn.offsetHeight/2)+"px";
    // 挿入位置を決定（横並びなので中心X比較）
    const others=[...box.querySelectorAll(".tag-btn:not(.dragging-btn), .add-tag")];
    let placed=false;
    for(const other of others){
      const r=other.getBoundingClientRect();
      if(pt.clientX < r.left+r.width/2){ box.insertBefore(placeholder,other); placed=true; break; }
    }
    if(!placed){ const add=box.querySelector(".add-tag"); box.insertBefore(placeholder, add||null); }
  }
  function onUp(){
    clearTimeout(pressTimer);pressTimer=null;
    if(dragging){
      box.insertBefore(btn,placeholder);placeholder.remove();
      btn.classList.remove("dragging-btn");
      btn.style.position="";btn.style.zIndex="";btn.style.left="";btn.style.top="";btn.style.width="";btn.style.pointerEvents="";
      saveTypeOrder();
      setTimeout(()=>{btn.dataset.dragging="";},50);
    }
    cleanup();
  }
  function cleanup(){
    document.removeEventListener("touchmove",onMove);
    document.removeEventListener("mousemove",onMove);
    document.removeEventListener("touchend",onUp);
    document.removeEventListener("mouseup",onUp);
    dragging=false;
  }
  btn.addEventListener("touchstart",onDown,{passive:true});
  btn.addEventListener("mousedown",onDown);
}
function saveTypeOrder(){
  const g=curGame();if(!g)return;
  const box=document.getElementById("tagButtons");
  const ids=[...box.querySelectorAll(".tag-btn")].map(el=>el.dataset.typeId).filter(Boolean);
  g.tagTypes.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));
  renderFilters();scheduleSave();
}
function renderFilters(){
  const box=document.getElementById("filters");box.innerHTML="";
  const g=curGame();if(!g)return;
  const all=document.createElement("button");all.className="filter-chip"+(activeFilter===null?" active":"");all.textContent="すべて";
  all.onclick=()=>{activeFilter=null;renderFilters();renderTags();};box.appendChild(all);
  g.tagTypes.forEach(t=>{
    const c=document.createElement("button");c.className="filter-chip"+(activeFilter===t.id?" active":"");
    c.innerHTML='<span class="dot" style="background:'+t.color+'"></span>'+escapeHtml(t.name);
    c.onclick=()=>{activeFilter=t.id;renderFilters();renderTags();};box.appendChild(c);
  });
}
function renderSummary(){
  const box=document.getElementById("summary");const g=curGame();
  if(!g||g.tags.length===0){box.innerHTML="";return;}
  const counts={};
  g.tags.forEach(t=>{counts[t.typeId]=(counts[t.typeId]||0)+1;});
  box.innerHTML="";
  g.tagTypes.forEach(ty=>{
    const n=counts[ty.id]||0;if(n===0)return;
    const chip=document.createElement("div");chip.className="sum-chip";
    chip.innerHTML='<span class="dot" style="background:'+ty.color+'"></span>'+escapeHtml(ty.name)+' <b>'+n+'</b>';
    box.appendChild(chip);
  });
}
function renderTags(){
  const list=document.getElementById("tagList");const g=curGame();
  const bar=document.getElementById("playallBar");
  if(!g){list.innerHTML='<div class="empty-list">試合を選ぶとタグが表示されます。</div>';document.getElementById("countPill").textContent="0 件";document.getElementById("summary").innerHTML="";bar.style.display="none";return;}
  renderSummary();
  let shown=g.tags.filter(t=>activeFilter===null||t.typeId===activeFilter).slice();
  // 手動順があればそれに従い、なければ時間順
  if(g.manualOrder&&g.manualOrder.length){
    shown.sort((a,b)=>{
      const ia=g.manualOrder.indexOf(a.id), ib=g.manualOrder.indexOf(b.id);
      if(ia===-1&&ib===-1)return tagStart(a)-tagStart(b);
      if(ia===-1)return 1; if(ib===-1)return -1;
      return ia-ib;
    });
  }else{
    shown.sort((a,b)=>tagStart(a)-tagStart(b));
  }
  document.getElementById("countPill").textContent=shown.length+" 件";
  bar.style.display=shown.length>0?"flex":"none";
  if(shown.length===0){list.innerHTML='<div class="empty-list">'+(g.tags.length===0?"まだタグがありません。<br>動画を再生して、プレーにタグを打ってみましょう。":"このタグの記録はありません。")+'</div>';return;}
  list.innerHTML="";
  shown.forEach((t,idx)=>{
    const ty=typeById(t.typeId);
    const s=tagStart(t), e=tagEnd(t);
    const timeLabel=(e!==undefined)?(fmt(s)+'<span class="dash">→</span>'+fmt(e)):fmt(s);
    const dur=(e!==undefined)?'<span class="dur">'+Math.round(e-s)+'秒</span>':'';
    const item=document.createElement("div");item.className="tag-item";item.style.borderLeftColor=ty.color;
    item.dataset.tagId=t.id;
    item.innerHTML='<div class="time">'+timeLabel+dur+'</div><div class="body">'+
      '<div class="label"><span class="dot" style="background:'+ty.color+'"></span>'+escapeHtml(ty.name)+'</div>'+
      (t.note?'<div class="note">'+escapeHtml(t.note)+'</div>':"")+
      '<input class="note-input" placeholder="メモを追加…" value="'+escapeAttr(t.note)+'"></div>'+
      '<div class="del" title="削除">🗑</div>';
    item.onclick=(ev)=>{if(ev.target.classList.contains("note-input")||ev.target.classList.contains("del"))return;if(item.dataset.dragging==="1")return;seekTo(s);};
    const ni=item.querySelector(".note-input");ni.onclick=(ev)=>ev.stopPropagation();ni.oninput=(ev)=>setNote(t.id,ev.target.value);
    item.querySelector(".del").onclick=(ev)=>{ev.stopPropagation();delTag(t.id);};
    attachDragSort(item);
    list.appendChild(item);
  });
}

/* ===== 長押しドラッグで右タグ一覧を並び替え ===== */
function attachDragSort(item){
  let pressTimer=null, dragging=false, startY=0, placeholder=null, clone=null, list=null;
  const LONG_PRESS=250;
  function onDown(e){
    // メモ欄・削除ボタンの上では開始しない
    if(e.target.classList.contains("note-input")||e.target.classList.contains("del"))return;
    const pt=e.touches?e.touches[0]:e;
    startY=pt.clientY;
    pressTimer=setTimeout(()=>{ beginDrag(pt); }, LONG_PRESS);
    document.addEventListener("touchmove",onMove,{passive:false});
    document.addEventListener("mousemove",onMove);
    document.addEventListener("touchend",onUp);
    document.addEventListener("mouseup",onUp);
  }
  function beginDrag(pt){
    dragging=true;item.dataset.dragging="1";
    list=document.getElementById("tagList");
    if(navigator.vibrate)navigator.vibrate(20); // 触覚フィードバック
    item.classList.add("drag-source");
    // 並び替え対象の高さ確保用プレースホルダ
    placeholder=document.createElement("div");
    placeholder.className="drag-placeholder";
    placeholder.style.height=item.offsetHeight+"px";
    item.parentNode.insertBefore(placeholder,item.nextSibling);
    item.classList.add("dragging");
    item.style.width=item.offsetWidth+"px";
  }
  function onMove(e){
    if(pressTimer&&!dragging){
      // 長押し完了前に大きく動いたらスクロール扱いでキャンセル
      const pt=e.touches?e.touches[0]:e;
      if(Math.abs(pt.clientY-startY)>10){clearTimeout(pressTimer);pressTimer=null;cleanup();}
      return;
    }
    if(!dragging)return;
    e.preventDefault();
    const pt=e.touches?e.touches[0]:e;
    item.style.position="fixed";
    item.style.zIndex="9999";
    item.style.left=item.getBoundingClientRect().left+"px";
    item.style.top=(pt.clientY-item.offsetHeight/2)+"px";
    item.style.pointerEvents="none";
    // 挿入位置を決める：プレースホルダを移動
    const items=[...list.querySelectorAll(".tag-item:not(.dragging)")];
    let placed=false;
    for(const other of items){
      const r=other.getBoundingClientRect();
      if(pt.clientY < r.top+r.height/2){ list.insertBefore(placeholder,other); placed=true; break; }
    }
    if(!placed)list.appendChild(placeholder);
  }
  function onUp(){
    clearTimeout(pressTimer);pressTimer=null;
    if(dragging){
      // プレースホルダの位置にitemを戻して、新しい順序を保存
      list.insertBefore(item,placeholder);
      placeholder.remove();
      item.classList.remove("dragging","drag-source");
      item.style.position="";item.style.zIndex="";item.style.left="";item.style.top="";item.style.width="";item.style.pointerEvents="";
      saveNewOrder();
      setTimeout(()=>{item.dataset.dragging="";},50); // クリック誤発火防止
    }
    cleanup();
  }
  function cleanup(){
    document.removeEventListener("touchmove",onMove);
    document.removeEventListener("mousemove",onMove);
    document.removeEventListener("touchend",onUp);
    document.removeEventListener("mouseup",onUp);
    dragging=false;
  }
  item.addEventListener("touchstart",onDown,{passive:true});
  item.addEventListener("mousedown",onDown);
}
function saveNewOrder(){
  const g=curGame();if(!g)return;
  const list=document.getElementById("tagList");
  const order=[...list.querySelectorAll(".tag-item")].map(el=>el.dataset.tagId).filter(Boolean);
  g.manualOrder=order;
  scheduleSave();
}
function escapeHtml(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function escapeAttr(s){return (s||"").replace(/"/g,"&quot;");}
function openTagModal(){if(!curGame())return;document.getElementById("newTagName").value="";selectedColor=PALETTE[0];document.getElementById("saveTpl").checked=false;renderSwatches();renderTemplates();document.getElementById("tagModalBg").classList.add("show");document.getElementById("newTagName").focus();}
function closeTagModal(){document.getElementById("tagModalBg").classList.remove("show");}
function renderSwatches(){const box=document.getElementById("swatches");box.innerHTML="";PALETTE.forEach(c=>{const s=document.createElement("div");s.className="swatch"+(c===selectedColor?" sel":"");s.style.background=c;s.onclick=()=>{selectedColor=c;renderSwatches();};box.appendChild(s);});}
function renderTemplates(){
  const sec=document.getElementById("tplSection"), box=document.getElementById("tplList");
  if(!tagTemplates.length){sec.style.display="none";return;}
  sec.style.display="block";box.innerHTML="";
  tagTemplates.forEach((tpl,i)=>{
    const chip=document.createElement("div");chip.className="tpl-chip";
    chip.innerHTML='<span class="dot" style="background:'+tpl.color+'"></span>'+escapeHtml(tpl.name)+'<span class="tpl-x" title="定番から削除">×</span>';
    chip.onclick=(e)=>{
      if(e.target.classList.contains("tpl-x")){e.stopPropagation();tagTemplates.splice(i,1);renderTemplates();scheduleSave();return;}
      // 定番を選んだら名前・色を反映
      document.getElementById("newTagName").value=tpl.name;
      selectedColor=tpl.color;renderSwatches();
    };
    box.appendChild(chip);
  });
}
function createTagType(){
  const g=curGame();if(!g)return;
  const name=document.getElementById("newTagName").value.trim();
  if(!name){alert("タグ名を入力してください。");return;}
  g.tagTypes.push({id:"t_"+Date.now(),name,color:selectedColor});
  // 定番登録チェックがあれば、テンプレートにも追加（同名は更新）
  if(document.getElementById("saveTpl").checked){
    const exist=tagTemplates.findIndex(t=>t.name===name);
    if(exist>=0){tagTemplates[exist].color=selectedColor;}
    else{tagTemplates.push({name,color:selectedColor});}
  }
  closeTagModal();renderTagButtons();renderFilters();scheduleSave();
}
document.getElementById("addGameBtn").onclick=openGameModal;
document.getElementById("createGame").onclick=createGame;
document.getElementById("cancelGame").onclick=closeGameModal;
document.getElementById("gameModalBg").onclick=(e)=>{if(e.target.id==="gameModalBg")closeGameModal();};
document.getElementById("gUrl").addEventListener("keydown",e=>{if(e.key==="Enter")createGame();});
document.getElementById("createTag").onclick=createTagType;
document.getElementById("cancelTag").onclick=closeTagModal;
document.getElementById("newTagName").addEventListener("keydown",e=>{if(e.key==="Enter")createTagType();});
document.getElementById("tagModalBg").onclick=(e)=>{if(e.target.id==="tagModalBg")closeTagModal();};
function skip(sec){if(player&&player.getCurrentTime&&player.seekTo){const t=Math.max(0,player.getCurrentTime()+sec);player.seekTo(t,true);}}
function togglePlay(){if(!player||!player.getPlayerState)return;const s=player.getPlayerState();if(s===1){player.pauseVideo();}else{player.playVideo();}}

/* speed control */
const SPEEDS=[0.5,1,1.25,1.5,2];
let speedIdx=1;
function cycleSpeed(){
  speedIdx=(speedIdx+1)%SPEEDS.length;
  const r=SPEEDS[speedIdx];
  if(player&&player.setPlaybackRate)player.setPlaybackRate(r);
  document.getElementById("speedBtn").textContent=r+"x";
}

/* play-all (consecutive playback of filtered tags) */
let playAll={on:false,queue:[],idx:0,timer:null,watch:null};
const CLIP_LEAD=3, CLIP_LEN=8; // 区間なし旧タグ用：3秒前から約8秒
const FIRST_LEAD=8; // 最初のクリップだけ8秒前から再生
function startPlayAll(){
  const g=curGame();if(!g||!playerReady())return;
  const list=g.tags.filter(t=>activeFilter===null||t.typeId===activeFilter).slice().sort((a,b)=>tagStart(a)-tagStart(b));
  if(list.length===0)return;
  playAll.on=true;playAll.queue=list;playAll.idx=0;
  updatePlayAllBtn();
  playClip(0);
}
function stopPlayAll(){
  playAll.on=false;clearTimeout(playAll.timer);clearInterval(playAll.watch);
  updatePlayAllBtn();
}
function playClip(i){
  if(!playAll.on)return;
  if(i>=playAll.queue.length){stopPlayAll();return;}
  playAll.idx=i;
  clearTimeout(playAll.timer);clearInterval(playAll.watch);
  const t=playAll.queue[i];
  const e=tagEnd(t);
  const lead=(i===0)?FIRST_LEAD:0; // 最初のクリップだけ8秒前から
  document.getElementById("playallInfo").textContent=(i+1)+" / "+playAll.queue.length;
  if(e!==undefined){
    // 区間タグ：開始へ飛んで再生し、終了点に達したら次へ
    const start=Math.max(0,tagStart(t)-lead);
    player.seekTo(start,true);player.playVideo();
    playAll.watch=setInterval(()=>{
      if(!playAll.on){clearInterval(playAll.watch);return;}
      if(playerReady() && player.getCurrentTime()>=e){ clearInterval(playAll.watch); playClip(i+1); }
    },200);
  }else{
    // 旧タグ（区間なし）：従来のフォールバック
    const start=Math.max(0,tagStart(t)-(lead||CLIP_LEAD));
    player.seekTo(start,true);player.playVideo();
    playAll.timer=setTimeout(()=>playClip(i+1), (CLIP_LEN+lead)*1000);
  }
}
function updatePlayAllBtn(){
  const btn=document.getElementById("playAllBtn");
  if(playAll.on){btn.textContent="■ 停止";btn.classList.add("playing");}
  else{btn.textContent="▶ 連続再生";btn.classList.remove("playing");document.getElementById("playallInfo").textContent="";}
}

document.getElementById("back5").onclick=()=>skip(-5);
document.getElementById("fwd5").onclick=()=>skip(5);
document.getElementById("playpause").onclick=togglePlay;
document.getElementById("speedBtn").onclick=cycleSpeed;
document.getElementById("playAllBtn").onclick=()=>{playAll.on?stopPlayAll():startPlayAll();};
document.getElementById("gamesToggle").onclick=()=>{document.querySelector(".app").classList.toggle("games-collapsed");};
document.addEventListener("keydown",e=>{
  if(document.querySelector(".modal-bg.show"))return;
  if(e.target.tagName==="INPUT")return;
  const g=curGame();if(!g)return;
  if(e.key===","){e.preventDefault();skip(-5);return;}
  if(e.key==="."){e.preventDefault();skip(5);return;}
  if(e.code==="Space"){e.preventDefault();togglePlay();return;}
  const n=parseInt(e.key);
  if(n>=1&&n<=9&&g.tagTypes[n-1]){e.preventDefault();addTag(g.tagTypes[n-1].id);}
});
/* ---------- sync (Firebase bridge) ---------- */
let saveTimer=null, signedIn=false;
function scheduleSave(){
  if(!signedIn||!window.PlayIQ)return;
  setSyncState("saving");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ window.PlayIQ.save({games:games, templates:tagTemplates}); }, 1200);
}
function setSyncState(s){
  const el=document.getElementById("syncState");
  if(!signedIn){el.textContent="";el.className="sync-state";return;}
  if(s==="saving"){el.textContent="保存中…";el.className="sync-state saving";}
  else if(s==="saved"){el.textContent="✓ 同期済み";el.className="sync-state saved";}
  else if(s==="error"){el.textContent="⚠ 保存失敗";el.className="sync-state";}
}
window.onAuthIn=(u)=>{
  signedIn=true;
  document.getElementById("loginBtn").style.display="none";
  document.getElementById("userChip").style.display="flex";
  document.getElementById("userName").textContent=u.name;
  const ph=document.getElementById("userPhoto");
  if(u.photo){ph.src=u.photo;ph.style.display="";}else{ph.style.display="none";}
};
window.onAuthOut=()=>{
  signedIn=false;
  document.getElementById("loginBtn").style.display="";
  document.getElementById("userChip").style.display="none";
  setSyncState("");
};
window.onDataLoaded=(remote)=>{
  // 新形式 {games, templates} / 旧形式（配列）両対応
  if(Array.isArray(remote)){ if(remote.length>0)games=remote; }
  else if(remote&&typeof remote==="object"){
    if(Array.isArray(remote.games)&&remote.games.length>0)games=remote.games;
    if(Array.isArray(remote.templates))tagTemplates=remote.templates;
  }
  currentGameId=null;
  const ct=document.getElementById("curTitle");
  ct.textContent="試合を選択してください";ct.style.color="var(--txt-dim)";ct.style.fontWeight="600";
  document.getElementById("curDate").textContent="";
  document.getElementById("tagdeck").classList.add("disabled");
  document.getElementById("playerEmpty").style.display="grid";
  renderGames();renderTagButtons();renderFilters();renderTags();
  setSyncState("saved");
};
window.onSyncSaved=()=>setSyncState("saved");
window.onSyncError=()=>setSyncState("error");
document.getElementById("loginBtn").onclick=()=>window.PlayIQ&&window.PlayIQ.login();
document.getElementById("logoutBtn").onclick=()=>window.PlayIQ&&window.PlayIQ.logout();

renderGames();renderTagButtons();renderFilters();renderTags();

/* PWA: register service worker */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(e=>console.log("SW登録失敗",e)); });
}
</script>
